<section class="space-y-6">

  <!-- WRITE REVIEW -->
  <div class="bg-white border rounded-2xl p-6 shadow-md space-y-4">

    <h3 class="text-xl font-semibold">
      Write a Review
    </h3>

    <!-- NAME -->
    <input type="text" [(ngModel)]="reviewForm.name" placeholder="Your name" class="w-full border rounded-xl p-3" />

    <!-- RATING -->
    <div class="flex gap-2 text-2xl">

      @for(star of [1,2,3,4,5]; track $index){

      <i (click)="toggleRating(star)" class="cursor-pointer" [class.fa-solid]="star <= reviewForm.rating"
        [class.fa-regular]="star > reviewForm.rating" class="fa-star text-yellow-500"></i>

      }

    </div>

    <!-- COMMENT -->
    <textarea [(ngModel)]="reviewForm.comment" rows="4" placeholder="Write your review..."
      class="w-full border rounded-xl p-3"></textarea>

    <!-- BUTTON -->
    <button (click)="addReview()" class="bg-black text-white px-6 py-3 rounded-xl">
      {{ isEditMode ? 'Update Review' : 'Submit Review' }}
    </button>

  </div>
  <div>

    <h2 class="text-2xl font-semibold text-gray-900">
      Customer Reviews
    </h2>

    <!-- REVIEWS -->
    <div class="flex gap-6 overflow-x-auto pb-4 scroll-smooth snap-x snap-mandatory">

      @for(review of productReviews; track $index){

      <div class="min-w-[300px] snap-start
               bg-white border rounded-2xl
               p-5 shadow-md hover:shadow-xl
               transition-all duration-300">

        <h4 class="font-semibold text-gray-800">
          {{ review.name }}
        </h4>

        <p class="text-yellow-500 text-lg">
          @for(star of getStars(review.rating); track $index){

          @if(star === 1){
          <i class="fa-solid fa-star"></i>
          } @else {
          <i class="fa-regular fa-star"></i>
          }

          }
        </p>

        <p class="text-gray-600 mt-2">
          {{ review.comment }}
        </p>

      </div>

      }

    </div>
  </div>

</section>
